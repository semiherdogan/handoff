[tools]
git-cliff = "2.13.1"
rust = "1.96.0"

[tasks."changelog:preview"]
description = "Preview unreleased changelog entries generated by git-cliff"
run = "git-cliff --config cliff.toml --unreleased"

[tasks."changelog:release"]
description = "Move unreleased git-cliff entries into a release section"
run = "bash scripts/prepare-release-changelog.sh"
